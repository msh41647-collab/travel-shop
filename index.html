<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>여행 쇼핑 체크리스트</title>
<style>
:root{--bg:#fff;--box:#f3f4f6;--line:#eceef1;--line2:#d9dce1;--text:#111827;--sub:#6b7280;--muted:#a0a6b0;--pri:#111827;--red:#d92d20;--red-bg:#fdecec;--acc:#2f6fed;--acc-bg:#e8f0fe}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",Roboto,sans-serif;font-size:13px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
.ic{display:block;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:52px;padding:0 8px 0 16px;background:#fff;border-bottom:1px solid var(--line)}
header.has-back{padding-left:2px}
.h-title{flex:1;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-title.big{font-size:19px}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.icon-btn.mu{color:var(--sub)}
.rate{font-size:11px;color:var(--sub);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;white-space:nowrap;margin-right:6px}
main{padding:14px 16px 110px;max-width:640px;margin:0 auto}
.mu{color:var(--sub)}.xs{font-size:11px}
.sec{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:12px;color:var(--sub);margin:18px 0 6px;text-align:left}
.sec.first{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:12px;padding:4px 11px;border-radius:999px;white-space:nowrap;line-height:1.3;flex:none}
.chip.sm{font-size:10.5px;padding:1px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:#fff;font-size:13px}
.btn.sm{min-height:34px;font-size:12px;padding:0 10px}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.block{width:100%;margin-top:14px}
.link-danger{display:block;width:100%;text-align:center;color:var(--red);font-size:13px;padding:16px 0 4px}
.bar{height:4px;background:var(--box);border-radius:2px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
.bar.over>i{background:var(--red)}
.meta{font-size:11.5px;color:var(--sub)}
.grow{flex:1;min-width:0;display:block}
.empty{text-align:center;color:var(--sub);padding:44px 12px;line-height:1.7}
/* 여행 목록 */
.tcard{border:1px solid var(--line2);border-radius:6px;padding:14px;margin-bottom:10px;cursor:pointer}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-name{font-size:15px;font-weight:600}
.dday{background:var(--acc-bg);color:var(--acc)}
.tcard .meta{margin:2px 0 12px}
.tc-foot{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.tc-btns{display:flex;gap:6px;margin-top:12px}.tc-btns .btn{flex:1}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:none}
.pname{font-weight:600;font-size:14px}
/* 요약 */
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:var(--box);border-radius:6px;padding:9px 11px}
.num{font-size:17px;font-weight:600;margin-top:1px}
.duty{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin:12px 0 4px}
.warn{background:var(--red-bg);color:var(--red);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:12px;font-weight:600}
.hint{background:var(--box);border-radius:6px;padding:8px 10px;margin-top:10px;font-size:12px;color:var(--sub)}
.hint button{color:var(--acc);font-weight:600;text-decoration:underline}
/* 도구줄 */
.toolbar{display:flex;align-items:center;gap:6px;margin-top:14px}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px 0}
.chips-scroll::-webkit-scrollbar{display:none}
.chip.all{background:var(--box);color:var(--text)}
.chip.all.on{background:var(--pri);color:#fff}
.seg2{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;flex:none}
.seg2 button{width:34px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.seg2 button.on{background:var(--pri);color:#fff}
.sbtn{width:34px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--sub);border-radius:6px;flex:none}
.sbtn.on{background:var(--box);color:var(--text)}
.search{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.search input{grid-column:1/-1}
/* 입력 */
input,select,textarea{font:inherit;font-size:14px;width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--text)}
select{font-size:12.5px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
/* 리스트 보기 */
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.thumb{width:58px;height:58px;border-radius:6px;background:var(--box);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;cursor:pointer}
.thumb img,.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.s{width:38px;height:38px}
.linfo{flex:1;min-width:0;cursor:pointer}
.lname{font-size:14px;font-weight:600;word-break:break-all}
.lname .n{font-weight:400;color:var(--sub)}
.lmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin:3px 0}
.lprice{font-size:12.5px}.lprice b{font-weight:600}.lprice .mu{font-size:11.5px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);vertical-align:3px;margin-left:5px}
.ck{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none;margin-right:-9px}
.ck span{width:24px;height:24px;border-radius:50%;border:1.5px solid #c4c8cf;display:flex;align-items:center;justify-content:center;background:#fff;color:#fff}
.ck.on span{background:var(--pri);border-color:var(--pri)}
.lrow.done .lname{text-decoration:line-through;font-weight:500;color:var(--muted)}
.lrow.done .thumb{opacity:.6}
.lrow.done .small{font-size:12px;color:var(--muted)}
/* 그리드 보기 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.gimg{position:relative;aspect-ratio:1;border-radius:6px;background:var(--box);color:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.gimg .ck{position:absolute;top:0;right:0;margin:0}
.gimg .chip{position:absolute;left:6px;bottom:6px}
.gname{font-size:13px;font-weight:600;margin-top:6px;word-break:break-all;cursor:pointer}
.gprice{font-size:12px}.gprice .mu{font-size:11px}
.gcard.done{opacity:.5}.gcard.done .gname{text-decoration:line-through}
/* + 버튼 */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(17,24,39,.25);z-index:6}
/* 아래에서 올라오는 창 */
dialog{border:none;padding:0;width:100%;max-width:640px;margin:auto auto 0;border-radius:12px 12px 0 0;max-height:94vh;background:#fff;color:var(--text)}
dialog::backdrop{background:rgba(17,24,39,.35)}
.sheet{padding:0 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;max-height:94vh}
.sh-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;padding:10px 0 6px;z-index:2;margin-right:-8px}
.sh-head h2{margin:0;font-size:16px;font-weight:600;outline:none}
.fl{display:block;font-size:11.5px;color:var(--sub);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two.wide{grid-template-columns:2fr 1fr}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg label{flex:1}.seg label+label{border-left:1px solid var(--line2)}
.seg input{display:none}
.seg span{display:flex;align-items:center;justify-content:center;height:38px;font-size:13px;cursor:pointer}
.seg input:checked+span{background:var(--pri);color:#fff}
.krw{font-size:11.5px;color:var(--acc);margin-top:3px;min-height:1em}
.checks{display:flex;gap:18px;margin-top:14px}
.checks label{display:flex;align-items:center;gap:7px;font-size:13px}
.checks input{width:18px;height:18px;min-height:0;margin:0;accent-color:var(--pri)}
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:160px;border-radius:6px;background:var(--box);color:var(--sub);overflow:hidden;font-size:12px;cursor:pointer;margin-top:4px}
.photo img{width:100%;height:100%;object-fit:contain}
.photo-actions{display:flex;justify-content:flex-end;gap:14px;margin-top:6px;font-size:12px;min-height:4px}
.photo-actions button,.photo-actions label{color:var(--sub);text-decoration:underline;cursor:pointer}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.chip.add{border:1px dashed var(--line2);background:#fff;color:var(--sub)}
.chip.cur{background:#fff;border:1px solid var(--line2);color:var(--text)}
.chip.cur.on{background:var(--pri);border-color:var(--pri);color:#fff}
.actions{display:flex;gap:8px;margin-top:18px}.actions .btn{flex:1}
.note{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.saved{background:var(--box);border-radius:6px;padding:7px 10px;font-size:12px;margin-bottom:6px}
.st{font-size:13px;font-weight:600;margin:22px 0 6px}.st.first{margin-top:6px}
.inrow{display:flex;gap:6px}.inrow input{flex:1}
.cat-del{padding-right:4px}
.cat-del button{width:20px;height:20px;display:flex;align-items:center;justify-content:center;opacity:.7}
.menu-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;font-size:14px;cursor:pointer}
.menu-row.last{border-bottom:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--pri);color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<button id="fab" class="fab" data-act="newItem" aria-label="품목 추가" hidden></button>
<dialog id="sheet"><div id="sheetBody"></div></dialog>
<div id="toast"></div>

<script>
/* ---------- 기본값 ---------- */
const DEFAULT_CATS=['약','간식','화장품','옷','기념품','전자제품','기타'];
const PRI={1:'꼭',2:'있으면',3:'구경만'};
const CURS=[['JPY','일본 엔'],['USD','미국 달러'],['EUR','유로'],['THB','태국 바트'],['CNY','중국 위안'],['TWD','대만 달러'],['HKD','홍콩 달러'],['VND','베트남 동'],['PHP','필리핀 페소'],['SGD','싱가포르 달러'],['MYR','말레이시아 링깃'],['GBP','영국 파운드'],['AUD','호주 달러'],['KRW','원화']];
const SYM={JPY:'¥',USD:'$',EUR:'€',GBP:'£',CNY:'CN¥',THB:'฿',VND:'₫',PHP:'₱',TWD:'NT$',HKD:'HK$',SGD:'S$',AUD:'A$',MYR:'RM'};
const PAL={red:['#fdecec','#b42318','#d92d20'],yellow:['#fdf3d6','#8f5f00','#c99400'],pink:['#fce7f1','#b0306e','#d6407f'],blue:['#e7effd','#1d55c4','#2f6fed'],aqua:['#dff4f2','#0b766e','#0f9488'],violet:['#efe9fd','#6234c9','#7c4dea'],orange:['#fdeee2','#b4530f','#e46c12'],green:['#e6f4ea','#1e7d34','#2f9a48'],gray:['#eef0f3','#4b5563','#6b7280']};
const CAT_COLOR={'약':'red','간식':'yellow','화장품':'pink','옷':'blue','기념품':'aqua','전자제품':'violet','기타':'gray'};
const EXTRA=['orange','green','blue','aqua','violet','pink','red','yellow'];

/* ---------- 아이콘 ---------- */
const P={
'chevron-left':'<polyline points="15 18 9 12 15 6"/>','chevron-right':'<polyline points="9 18 15 12 9 6"/>',
'chevron-down':'<polyline points="6 9 12 15 18 9"/>','chevron-up':'<polyline points="18 15 12 9 6 15"/>',
x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
check:'<polyline points="20 6 9 17 4 12"/>',
search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'};
const ic=(n,s=20,w=2)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- 상태 ---------- */
let db,trips=[],items=[];
let settings={key:'main',categories:[...DEFAULT_CATS],dutyLimit:'',lastBackup:null,viewMode:'list',boughtOpen:true};
let view={name:'trips',id:null};
let filt={cat:'',q:'',who:'',shop:''},searchOpen=false;

/* ---------- 도우미 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null};
const fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2});
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ko'));
const clean=v=>String(v??'').trim().replace(/,/g,'');
const qty=i=>Math.max(1,parseInt(i.qty)||1);
const curTrip=()=>trips.find(x=>x.id===view.id);
const tripItems=id=>items.filter(i=>i.tripId===id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2300)}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function catColor(c){let k=CAT_COLOR[c];if(!k){let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))>>>0;k=EXTRA[h%EXTRA.length]}const p=PAL[k];return{bg:p[0],tx:p[1],solid:p[2]}}
const catChip=(c,sm)=>{if(!c)return'';const k=catColor(c);return `<span class="chip${sm?' sm':''}" style="background:${k.bg};color:${k.tx}">${esc(c)}</span>`};
const orderCats=list=>list.sort((a,b)=>{const ia=settings.categories.indexOf(a),ib=settings.categories.indexOf(b);return(ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b,'ko')});
const code=t=>(t.currency||'').toUpperCase();
const isKRW=t=>code(t)==='KRW';
const toKRW=(a,t)=>isKRW(t)?a:(num(t.rate)?a*num(t.rate):null);
function local(a,t){const c=code(t);if(!c)return fmt(a);if(c==='KRW')return won(a);return SYM[c]?SYM[c]+fmt(a):fmt(a)+' '+esc(c)}
const bigMoney=(a,t)=>toKRW(a,t)!=null?won(toKRW(a,t)):local(a,t);
function priceLine(a,t){const k=toKRW(a,t);return `<b>${local(a,t)}</b>`+(!isKRW(t)&&k!=null?` <span class="mu">${won(k)}</span>`:'')}
function rateLabel(t){const c=code(t);if(!c)return '여행 정보';if(c==='KRW')return '원화';const r=num(t.rate);if(!r)return '환율 입력';return `1${SYM[c]||(' '+c)} = ${fmt(r)}원`}
function totals(t){const list=tripItems(t.id);let act=0,rest=0,left=0;
  for(const i of list){const q=qty(i),e=num(i.est),a=num(i.actual);
    if(i.bought){if(a!=null)act+=a*q;else if(e!=null)act+=e*q}else{left++;if(e!=null)rest+=e*q}}
  return{count:list.length,left,act,rest}}
function dday(t,today){if(!t.start)return'';const d=Math.round((new Date(t.start)-new Date(today))/864e5);
  if(d>0)return 'D-'+d;if(d===0)return 'D-day';if((t.end||t.start)>=today)return '여행 중';return''}
const isPast=(t,today)=>{const e=t.end||t.start;return !!e&&e<today};
const thumb=(i,s)=>i.photo?`<img src="${i.photo}" alt="" loading="lazy">`:ic('image',s,1.6);
const ckBtn=i=>`<button class="ck${i.bought?' on':''}" data-act="toggle" data-id="${i.id}" aria-label="${i.bought?'구매 취소':'구매 완료'}"><span>${i.bought?ic('check',14,3):''}</span></button>`;

/* ---------- 저장(IndexedDB) ---------- */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('travel-shopping',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('trips',{keyPath:'id'});d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('settings',{keyPath:'key'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function req(store,mode,f){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=f(t.objectStore(store));
  t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const getAll=s=>req(s,'readonly',o=>o.getAll());
const put=(s,v)=>req(s,'readwrite',o=>o.put(v));
const putMany=(s,arr)=>req(s,'readwrite',o=>{arr.forEach(v=>o.put(v));return null});
const remove=(s,k)=>req(s,'readwrite',o=>o.delete(k));
const clearStore=s=>req(s,'readwrite',o=>o.clear());
const saveSettings=()=>put('settings',settings);
async function loadAll(){trips=await getAll('trips');items=await getAll('items');
  const m=(await getAll('settings')).find(x=>x.key==='main');if(m)settings=Object.assign({},settings,m)}

/* ---------- 화면: 여행 목록 ---------- */
function setHeader(html,back){const h=$('#hdr');h.innerHTML=html;h.classList.toggle('has-back',!!back)}
function renderTrips(){
  view={name:'trips',id:null};$('#fab').hidden=true;
  setHeader(`<h1 class="h-title big">내 여행</h1><button class="icon-btn" data-act="settings" aria-label="설정">${ic('sliders',20)}</button>`);
  const today=todayStr();
  const up=trips.filter(t=>!isPast(t,today)).sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999')||b.createdAt-a.createdAt);
  const past=trips.filter(t=>isPast(t,today)).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  let h='';
  if(!trips.length)h=`<div class="empty">아직 만든 여행이 없어요.<br>아래 버튼으로 첫 여행을 만들어 보세요.</div>`;
  if(up.length)h+=`<div class="sec first">다가오는 여행</div>`+up.map(t=>{
    const s=totals(t),bought=s.count-s.left,pct=s.count?bought/s.count*100:0,d=dday(t,today);
    const cnt={};tripItems(t.id).forEach(i=>{if(i.category)cnt[i.category]=(cnt[i.category]||0)+1});
    const chips=orderCats(Object.keys(cnt)).map(c=>{const k=catColor(c);return `<span class="chip sm" style="background:${k.bg};color:${k.tx}">${esc(c)} ${cnt[c]}</span>`}).join('');
    const dates=t.start&&t.end?`${t.start.slice(5).replace('-','/')} ~ ${t.end.slice(5).replace('-','/')}`:(t.start||'');
    return `<div class="tcard" data-act="open" data-id="${t.id}">
      <div class="tc-top"><span class="tc-name">${esc(t.name)}</span>${d?`<span class="chip sm dday">${d}</span>`:''}</div>
      <div class="meta">${esc([t.place,dates,code(t)].filter(Boolean).join(' · '))||'&nbsp;'}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="tc-foot"><span class="mu">${bought} / ${s.count}개 구매</span><span>${bigMoney(s.act,t)}</span></div>
      ${chips?`<div class="chips">${chips}</div>`:''}
      <div class="tc-btns"><button class="btn sm" data-act="editTrip" data-id="${t.id}">수정</button><button class="btn sm" data-act="copyTrip" data-id="${t.id}">목록 복사</button></div></div>`}).join('');
  if(past.length)h+=`<div class="sec${up.length?'':' first'}">지난 여행</div><div>`+past.map(t=>{const s=totals(t);
    const ym=t.start?t.start.slice(0,7).replace('-','.'):'날짜 없음';
    return `<div class="prow" data-act="open" data-id="${t.id}"><span class="grow"><span class="pname" style="display:block">${esc(t.name)}</span><span class="meta">${ym} · ${s.count}개 · ${bigMoney(s.act,t)}</span></span>
      <button class="icon-btn mu" data-act="copyTrip" data-id="${t.id}" aria-label="목록 복사">${ic('copy',18)}</button></div>`}).join('')+`</div>`;
  h+=`<button class="btn primary block" data-act="newTrip">${ic('plus',16)} 새 여행</button>`;
  $('#main').innerHTML=h}

/* ---------- 화면: 품목 목록 ---------- */
function openTrip(id){history.pushState({trip:id},'');view={name:'trip',id};filt={cat:'',q:'',who:'',shop:''};searchOpen=false;drawTrip();window.scrollTo(0,0)}
function tripHeader(t){setHeader(`<button class="icon-btn" data-act="back" aria-label="뒤로">${ic('chevron-left',24)}</button><h1 class="h-title">${esc(t.name)}</h1><button class="rate" data-act="editTrip" data-id="${t.id}">${rateLabel(t)}</button>`,true)}
function drawTrip(){const t=curTrip();if(!t)return renderTrips();tripHeader(t);
  $('#fab').hidden=false;$('#fab').innerHTML=ic('plus',24);
  $('#main').innerHTML=`<div id="summary"></div><div class="toolbar" id="toolbar"></div><div id="searchPanel"></div><div id="list"></div>`;
  updateTrip({search:true})}
function renderSearch(all){const p=$('#searchPanel');if(!searchOpen){p.innerHTML='';return}
  const opt=(vals,cur,label)=>`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  p.innerHTML=`<div class="search"><input type="search" id="q" placeholder="품목·메모 검색" value="${esc(filt.q)}">
    <select id="fWho">${opt(uniq(all.map(i=>i.recipient)),filt.who,'받는 사람 전체')}</select>
    <select id="fShop">${opt(uniq(all.map(i=>i.shop)),filt.shop,'살 곳 전체')}</select></div>`;
  $('#q').oninput=e=>{filt.q=e.target.value.trim().toLowerCase();updateTrip()};
  $('#fWho').onchange=e=>{filt.who=e.target.value;updateTrip()};
  $('#fShop').onchange=e=>{filt.shop=e.target.value;updateTrip()}}
function updateTrip(opt={}){
  const t=curTrip();if(!t)return renderTrips();
  const all=tripItems(t.id),s=totals(t),hasRate=toKRW(1,t)!=null;
  const sub=a=>hasRate&&!isKRW(t)?`<div class="mu xs">${local(a,t)}</div>`:'';
  let h=`<div class="sum2"><div class="box"><div class="mu xs">쓴 돈</div><div class="num">${bigMoney(s.act,t)}</div>${sub(s.act)}</div>
    <div class="box"><div class="mu xs">남은 예상</div><div class="num">${bigMoney(s.rest,t)}</div>${sub(s.rest)}</div></div>`;
  const lim=num(settings.dutyLimit),ak=toKRW(s.act,t);
  if(lim&&ak!=null){const over=ak>lim;
    h+=`<div class="duty"><span>면세한도</span><span>${Math.round(ak).toLocaleString('ko-KR')} / ${won(lim)}</span></div><div class="bar${over?' over':''}"><i style="width:${Math.min(100,ak/lim*100)}%"></i></div>`;
    if(over)h+=`<div class="warn">면세한도를 ${won(ak-lim)} 넘었어요. 입국 때 세관 신고가 필요할 수 있어요.</div>`}
  if(!hasRate)h+=`<div class="hint">환율을 넣으면 원화와 면세한도도 보여드려요. <button data-act="editTrip" data-id="${t.id}">환율 입력</button></div>`;
  else if(!lim)h+=`<div class="hint">면세한도를 설정하면 여기서 함께 볼 수 있어요. <button data-act="settings">설정하기</button></div>`;
  $('#summary').innerHTML=h;

  const cats=orderCats(uniq(all.map(i=>i.category)));if(filt.cat&&!cats.includes(filt.cat))filt.cat='';
  const sc=$('.chips-scroll'),left0=sc?sc.scrollLeft:0;
  $('#toolbar').innerHTML=`<div class="chips-scroll"><button class="chip all${filt.cat?'':' on'}" data-act="cat" data-cat="">전체</button>${cats.map(c=>{const k=catColor(c),on=filt.cat===c;
      return `<button class="chip" data-act="cat" data-cat="${esc(c)}" style="background:${on?k.solid:k.bg};color:${on?'#fff':k.tx}">${esc(c)}</button>`}).join('')}</div>
    <button class="sbtn${searchOpen?' on':''}" data-act="search" aria-label="검색">${ic('search',18)}</button>
    <div class="seg2"><button class="${settings.viewMode!=='grid'?'on':''}" data-act="view" data-v="list" aria-label="리스트 보기">${ic('list',16)}</button><button class="${settings.viewMode==='grid'?'on':''}" data-act="view" data-v="grid" aria-label="그리드 보기">${ic('grid',15)}</button></div>`;
  $('.chips-scroll').scrollLeft=left0;
  if(opt.search)renderSearch(all);

  if(!all.length){$('#list').innerHTML=`<div class="empty">아직 품목이 없어요.<br>오른쪽 아래 <b>＋</b> 버튼으로 살 물건을 추가해 보세요.</div>`;return}
  const match=i=>(!filt.cat||i.category===filt.cat)&&(!filt.who||i.recipient===filt.who)&&(!filt.shop||i.shop===filt.shop)&&(!filt.q||[i.name,i.memo,i.shop,i.recipient,i.category].join(' ').toLowerCase().includes(filt.q));
  const filtering=filt.cat||filt.q||filt.who||filt.shop;
  const left=all.filter(i=>!i.bought&&match(i)).sort((a,b)=>((a.priority||2)-(b.priority||2))||(a.createdAt-b.createdAt));
  const done=all.filter(i=>i.bought&&match(i)).sort((a,b)=>(b.boughtAt||0)-(a.boughtAt||0));
  const grid=settings.viewMode==='grid';
  const block=(arr,isDone)=>grid?`<div class="grid">${arr.map(i=>gCard(i,t)).join('')}</div>`:arr.map(i=>isDone?dRow(i,t):lRow(i,t)).join('');
  let L=`<div class="sec first">살 것 ${left.length}</div>`;
  L+=left.length?block(left,false):`<div class="empty" style="padding:22px 0">${filtering?'조건에 맞는 품목이 없어요.':'다 샀어요! 🎉'}</div>`;
  if(done.length)L+=`<button class="sec" data-act="toggleBought"><span>산 것 ${done.length}</span>${ic(settings.boughtOpen?'chevron-up':'chevron-down',16)}</button>`+(settings.boughtOpen?block(done,true):'');
  $('#list').innerHTML=L}
function lRow(i,t){const q=qty(i),e=num(i.est);
  const meta=[catChip(i.category,true),...[i.recipient,i.shop].filter(Boolean).map(esc),i.priority==3?'구경만':'',i.taxFree?'면세':''].filter(Boolean);
  return `<div class="lrow"><div class="thumb" data-act="editItem" data-id="${i.id}">${thumb(i,20)}</div>
    <div class="linfo" data-act="editItem" data-id="${i.id}"><div class="lname">${esc(i.name)}${q>1?` <span class="n">×${q}</span>`:''}${i.priority==1?'<span class="dot" title="꼭"></span>':''}</div>
    <div class="lmeta">${meta.join(' · ').replace(/<\/span> · /,'</span> ')}</div>
    <div class="lprice">${e!=null?priceLine(e*q,t):'<span class="mu">가격 미정</span>'}</div></div>${ckBtn(i)}</div>`}
function dRow(i,t){const q=qty(i),a=num(i.actual)??num(i.est);
  return `<div class="lrow done"><div class="thumb s" data-act="editItem" data-id="${i.id}">${thumb(i,15)}</div>
    <div class="linfo" data-act="editItem" data-id="${i.id}"><div class="lname">${esc(i.name)}${q>1?` ×${q}`:''}</div></div>
    ${a!=null?`<span class="small">${local(a*q,t)}</span>`:''}${ckBtn(i)}</div>`}
function gCard(i,t){const q=qty(i),p=i.bought?(num(i.actual)??num(i.est)):num(i.est);
  return `<div class="gcard${i.bought?' done':''}"><div class="gimg" data-act="editItem" data-id="${i.id}">${thumb(i,26)}${ckBtn(i)}${i.bought?'':catChip(i.category,true)}</div>
    <div class="gname" data-act="editItem" data-id="${i.id}">${esc(i.name)}${q>1?` ×${q}`:''}${i.priority==1&&!i.bought?'<span class="dot"></span>':''}</div>
    <div class="gprice">${p!=null?priceLine(p*q,t):'<span class="mu">가격 미정</span>'}</div></div>`}
async function toggle(id){const i=items.find(x=>x.id===id);i.bought=!i.bought;
  if(i.bought){i.boughtAt=Date.now();if(num(i.actual)==null&&num(i.est)!=null){i.actual=i.est;toast('실제 가격은 예상가로 넣어뒀어요')}}
  await put('items',i);updateTrip()}

/* ---------- 아래에서 올라오는 창 ---------- */
const sheet=$('#sheet');let skipPop=false;
function openSheet(html){$('#sheetBody').innerHTML=html;if(!sheet.open){sheet.showModal();history.pushState({sheet:true},'')}
  const s=$('#sheetBody .sheet');if(s)s.scrollTop=0}
const closeSheet=()=>sheet.close();
sheet.addEventListener('close',()=>{if(history.state&&history.state.sheet){skipPop=true;history.back()}});
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
window.addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}
  if(sheet.open){sheet.close();return}if(view.name==='trip')renderTrips()});
function refresh(){if(view.name==='trip'&&curTrip()){tripHeader(curTrip());updateTrip({search:true})}else renderTrips()}
const sheetHead=title=>`<div class="sh-head"><h2 tabindex="-1" autofocus>${title}</h2><button type="button" class="icon-btn mu" data-act="close" aria-label="닫기">${ic('x',20)}</button></div>`;

/* ---------- 여행 추가/수정 ---------- */
function tripForm(id){
  const t=id?trips.find(x=>x.id===id):{name:'',place:'',start:'',end:'',currency:'',rate:''};
  const QUICK=['JPY','USD','EUR','THB'];let cur=code(t),custom=!!cur&&!QUICK.includes(cur);
  openSheet(`<form id="tripF" class="sheet">${sheetHead(id?'여행 수정':'새 여행')}
    <label class="fl">여행 이름</label><input name="name" required value="${esc(t.name)}" placeholder="예: 도쿄 봄여행">
    <label class="fl">국가 / 도시</label><input name="place" value="${esc(t.place)}" placeholder="예: 일본 도쿄">
    <div class="two"><div><label class="fl">출발일</label><input type="date" name="start" value="${esc(t.start)}"></div>
      <div><label class="fl">돌아오는 날</label><input type="date" name="end" value="${esc(t.end)}"></div></div>
    <div class="fl">현지 통화</div><div class="pick" id="curPick"></div>
    <input id="curIn" list="curList" placeholder="통화 코드 (예: VND, TWD)" style="margin-top:6px" value="${custom?esc(cur):''}"${custom?'':' hidden'}>
    <datalist id="curList">${CURS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</datalist>
    <label class="fl" id="rateLbl"></label><input name="rate" inputmode="decimal" value="${esc(t.rate)}" placeholder="예: 9.2">
    <div class="note">출발 전에 은행 앱에서 환율을 확인해 넣어 주세요. 여행 중에도 바꿀 수 있어요.</div>
    <div class="actions"><button type="button" class="btn" data-act="close">취소</button><button class="btn primary">저장</button></div>
    ${id?`<button type="button" class="link-danger" data-act="delTrip" data-id="${id}">이 여행 삭제</button>`:''}</form>`);
  const curIn=$('#curIn'),getCur=()=>custom?curIn.value.trim().toUpperCase():cur;
  const lbl=()=>{const c=getCur();$('#rateLbl').textContent=c==='KRW'?'환율 (원화는 비워두세요)':`환율 · 1 ${c||'현지 돈'} = 몇 원?`};
  const draw=()=>{$('#curPick').innerHTML=QUICK.map(c=>`<button type="button" class="chip cur${!custom&&cur===c?' on':''}" data-c="${c}">${c}</button>`).join('')+`<button type="button" class="chip cur${custom?' on':''}" data-c="__custom">직접 입력</button>`;curIn.hidden=!custom;lbl()};
  draw();
  $('#curPick').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;if(b.dataset.c==='__custom'){custom=true;draw();curIn.focus()}else{custom=false;cur=b.dataset.c;draw()}};
  curIn.oninput=lbl;
  $('#tripF').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    const obj=Object.assign(id?t:{id:uid(),createdAt:Date.now()},{name:f.get('name').trim(),place:f.get('place').trim(),start:f.get('start'),end:f.get('end'),currency:getCur(),rate:clean(f.get('rate'))});
    if(!id)trips.push(obj);await put('trips',obj);closeSheet();refresh();toast(id?'저장했어요':'여행을 만들었어요')}}
async function delTrip(id){const t=trips.find(x=>x.id===id),list=tripItems(id);
  if(!confirm(`'${t.name}' 여행과 품목 ${list.length}개를 모두 지울까요?\n되돌릴 수 없어요.`))return;
  await remove('trips',id);for(const i of list)await remove('items',i.id);
  trips=trips.filter(x=>x.id!==id);items=items.filter(x=>x.tripId!==id);closeSheet();renderTrips();toast('삭제했어요')}
async function copyTrip(id){const src=trips.find(x=>x.id===id),now=Date.now();
  const nt={...src,id:uid(),name:src.name+' (복사)',start:'',end:'',createdAt:now};
  const copies=tripItems(id).sort((a,b)=>a.createdAt-b.createdAt).map((i,n)=>({...i,id:uid()+n,tripId:nt.id,bought:false,actual:'',boughtAt:null,createdAt:now+n}));
  await put('trips',nt);await putMany('items',copies);trips.push(nt);items.push(...copies);renderTrips();
  toast('복사했어요. [수정]에서 이름·날짜를 바꿔 주세요')}

/* ---------- 품목 추가/수정 ---------- */

  $('#catPick').onclick=async e=>{const b=e.target.closest('[data-pick]');if(!b)return;
    if(b.dataset.pick==='__new'){const n=(prompt('새 카테고리 이름')||'').trim();if(!n)return;
      if(!settings.categories.includes(n)){settings.categories.push(n);await saveSettings()}selCat=n}else selCat=b.dataset.pick;drawCats()};
  const showK=()=>{const q=Math.max(1,parseInt(g('qty').value)||1);
    [['est','#estK'],['actual','#actK']].forEach(([n,el])=>{const v=num(clean(g(n).value)),k=v!=null?toKRW(v,t):null;
      $(el).textContent=(k!=null&&!isKRW(t))?`≈ ${won(k)}`+(q>1?` · ${q}개 ${won(k*q)}`:''):''})};
  g('est').oninput=g('actual').oninput=g('qty').oninput=showK;showK();
  F.onsubmit=async e=>{e.preventDefault();
    const obj=id?i:{id:uid(),tripId:t.id,createdAt:Date.now()};
    Object.assign(obj,{name:g('name').value.trim(),category:selCat||'기타',recipient:g('recipient').value.trim(),
      qty:Math.max(1,parseInt(g('qty').value)||1),shop:g('shop').value.trim(),priority:+g('priority').value,
      est:clean(g('est').value),actual:clean(g('actual').value),taxFree:g('taxFree').checked,bought:g('bought').checked,memo:g('memo').value.trim(),photo});
    if(obj.bought&&!wasBought)obj.boughtAt=Date.now();
    if(!id)items.push(obj);await put('items',obj);updateTrip({search:true});
    if(e.submitter&&e.submitter.value==='more'){itemForm(null,obj.name);return}
    closeSheet();toast(id?'저장했어요':'추가했어요')}}
async function delItem(id){const i=items.find(x=>x.id===id);if(!confirm(`'${i.name}'을(를) 삭제할까요?`))return;
  await remove('items',id);items=items.filter(x=>x.id!==id);closeSheet();updateTrip({search:true});toast('삭제했어요')}
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const s=Math.min(1,1000/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.78))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

/* ---------- 설정 · 백업 ---------- */
function settingsSheet(){
  const last=settings.lastBackup?new Date(settings.lastBackup).toLocaleDateString('ko-KR'):'아직 없음';
  openSheet(`<div class="sheet">${sheetHead('설정')}
    <div class="st first">입국 면세한도</div>
    <div class="inrow"><input id="limitIn" inputmode="numeric" value="${num(settings.dutyLimit)?Number(num(settings.dutyLimit)).toLocaleString('ko-KR'):''}" placeholder="원 단위로 입력"><button class="btn" id="limitSave">저장</button></div>
    <div class="note">면세한도는 보통 달러로 정해져 있어요. 출발 전 관세청 안내에서 확인하고 원화로 바꿔 넣어 주세요. 넘으면 요약에 경고가 떠요. 비워두면 표시하지 않아요.</div>
    <div class="st">카테고리</div><div class="pick" id="catBox"></div>
    <div class="inrow" style="margin-top:8px"><input id="catIn" placeholder="새 카테고리"><button class="btn" id="catAdd">추가</button></div>
    <div class="st">백업</div>
    <button class="menu-row" id="expBtn">${ic('upload',18)}<span class="grow"><span style="display:block">내보내기</span><span class="meta">마지막 백업 · ${esc(last)}</span></span>${ic('chevron-right',18)}</button>
    <label class="menu-row last" for="impIn">${ic('download',18)}<span class="grow"><span style="display:block">불러오기</span><span class="meta">기기 변경 시 사용</span></span>${ic('chevron-right',18)}</label>
    <input type="file" id="impIn" hidden>
    <div class="hint">기록은 이 폰에만 저장돼요. 내보낸 파일은 구글 드라이브에 보관하세요.</div></div>`);
  const drawCats=()=>{$('#catBox').innerHTML=settings.categories.map(c=>{const k=catColor(c);return `<span class="chip cat-del" style="background:${k.bg};color:${k.tx}">${esc(c)}<button data-del="${esc(c)}" aria-label="${esc(c)} 삭제">${ic('x',12,2.5)}</button></span>`}).join('')};drawCats();
  $('#catBox').onclick=async e=>{const b=e.target.closest('[data-del]');if(!b)return;settings.categories=settings.categories.filter(c=>c!==b.dataset.del);await saveSettings();drawCats()};
  $('#catAdd').onclick=async()=>{const v=$('#catIn').value.trim();if(!v||settings.categories.includes(v))return;settings.categories.push(v);await saveSettings();$('#catIn').value='';drawCats()};
  $('#limitSave').onclick=async()=>{settings.dutyLimit=clean($('#limitIn').value);await saveSettings();refresh();alert('저장했어요')};
  $('#expBtn').onclick=exportData;
  $('#impIn').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''}}
async function exportData(){
  const data={app:'travel-shopping',version:2,exportedAt:new Date().toISOString(),trips,items,settings};
  const d=new Date(),stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const name=`여행쇼핑_백업_${stamp}.json`,blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  let done=false;
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done=true}}
  catch(e){if(e.name==='AbortError')return}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
  settings.lastBackup=Date.now();await saveSettings();
  alert(done?'백업 파일을 보냈어요.':'백업 파일을 "다운로드" 폴더에 저장했어요.\n구글 드라이브 앱에서 업로드해 두세요.');
  closeSheet()}
async function importFile(f){
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.trips)||!Array.isArray(d.items))throw 0;
    if(!confirm(`백업 파일: 여행 ${d.trips.length}개, 품목 ${d.items.length}개\n\n지금 앱에 있는 기록은 지워지고 이 내용으로 바뀌어요. 계속할까요?`))return;
    await clearStore('trips');await clearStore('items');await putMany('trips',d.trips);await putMany('items',d.items);
    if(d.settings){settings=Object.assign({},settings,d.settings,{key:'main'});await saveSettings()}
    trips=d.trips;items=d.items;closeSheet();renderTrips();toast('불러오기 완료!')}
  catch(e){alert('백업 파일을 읽지 못했어요.\n이 앱에서 내보낸 JSON 파일인지 확인해 주세요.')}}

/* ---------- 버튼 연결 & 시작 ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset,id=d.id;
  switch(d.act){
    case 'back':history.back();break;
    case 'settings':settingsSheet();break;
    case 'newTrip':tripForm();break;
    case 'newItem':itemForm();break;
    case 'open':openTrip(id);break;
    case 'editTrip':tripForm(id);break;
    case 'copyTrip':copyTrip(id);break;
    case 'toggle':toggle(id);break;
    case 'editItem':itemForm(id);break;
    case 'close':closeSheet();break;
    case 'delTrip':delTrip(id);break;
    case 'delItem':delItem(id);break;
    case 'cat':filt.cat=d.cat;updateTrip();break;
    case 'search':searchOpen=!searchOpen;if(!searchOpen){filt.q='';filt.who='';filt.shop=''}updateTrip({search:true});if(searchOpen)setTimeout(()=>{const q=$('#q');if(q)q.focus()},50);break;
    case 'view':settings.viewMode=d.v;saveSettings();updateTrip();break;
    case 'toggleBought':settings.boughtOpen=!settings.boughtOpen;saveSettings();updateTrip();break}});
(async()=>{history.replaceState({},'');
  try{db=await openDB();await loadAll()}catch(e){$('#main').innerHTML='<div class="empty">저장공간을 열 수 없어요.<br>크롬 일반 창에서 열어 주세요.</div>';return}
  renderTrips();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')})();
</script>
